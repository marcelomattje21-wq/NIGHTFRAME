name: Build and publish NIGHTFRAME Windows installer
on:
  push:
    branches:
      - main
    paths:
      - 'NIGHTFRAME_V43_Source.parts/**'
      - '.github/workflows/build-from-archive.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source payload
        uses: actions/checkout@v4
      - name: Reconstruct and verify V43 source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE/NIGHTFRAME_V43_Source.parts" -Filter '*.b64' | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Esperadas 8 partes base64; encontradas $($parts.Count)." }
          $encoded = [string]::Concat(($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }))
          $bytes = [Convert]::FromBase64String($encoded)
          $archive = "$env:GITHUB_WORKSPACE/NIGHTFRAME_V43_Source.zip"
          [IO.File]::WriteAllBytes($archive, $bytes)
          $expected = '9acd625645e10673956da718ffdc724e21790484900af6be2c16bc004dd954d2'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 do arquivo-fonte divergente: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE -Force
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare FFmpeg
        shell: pwsh
        run: ./SETUP_DEPENDENCIES.ps1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build NSIS installer and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always
